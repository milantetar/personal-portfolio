services:
    - type: web
      name: personal-portfolio
      runtime: docker
      # Free SQLite is ephemeral: database changes can disappear on restart.
      plan: free
      dockerfilePath: Dockerfile
      dockerContext: .
      healthCheckPath: /up
      envVars:
          - key: APP_NAME
            value: 'Personal Portfolio'
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false
          - key: DB_CONNECTION
            value: sqlite
          - key: DB_DATABASE
            value: /app/storage/app/database/portfolio.sqlite
          - key: DB_URL
            value: ''
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: sync
          - key: SESSION_SECURE_COOKIE
            value: 'true'
          - key: TRUSTED_PROXIES
            value: REMOTE_ADDR
          - key: LOG_CHANNEL
            value: stderr
          - key: LOG_LEVEL
            value: info
          - key: MAIL_MAILER
            value: resend
          - key: RESEND_API_KEY
            sync: false
          - key: MAIL_FROM_ADDRESS
            sync: false
          - key: SEED_ON_DEPLOY
            value: 'true'
          - key: DEPLOYMENT_CONTENT_SEED
            value: 'true'
          - key: FILESYSTEM_DISK
            value: local
          - key: MEDIA_STORAGE_DISK
            value: cloudinary
          - key: CLOUDINARY_URL
            sync: false
          - key: CLOUDINARY_FOLDER
            sync: false
          - key: GEMINI_API_KEY
            sync: false
          - key: GEMINI_MODEL
            value: gemini-4-hydrogen
          - key: GEMINI_FALLBACK_MODEL
            value: gemini-4-hydrogen
          - key: ADMIN_NAME
            value: 'Portfolio Admin'
          - key: ADMIN_EMAIL
            sync: false
          - key: ADMIN_PASSWORD
            generateValue: true
