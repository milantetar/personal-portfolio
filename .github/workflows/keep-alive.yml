name: Keep Render Alive

on:
    schedule:
        - cron: '*/10 * * * *'
    workflow_dispatch:

permissions: {}

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - name: Ping application health endpoint
              shell: bash
              env:
                  APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
              run: |
                  set -euo pipefail
                  if [[ -z "$APP_URL" || "$APP_URL" != https://* ]]; then
                    echo "::error::Set the APP_URL repository variable or secret to your HTTPS application URL."
                    exit 1
                  fi

                  # Bound retry scheduling to 100s; a final 60s attempt still
                  # finishes within the three-minute job timeout.
                  if metrics="$(curl --silent --show-error --fail --location \
                    --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
                    --retry-max-time 100 --proto '=https' --proto-redir '=https' \
                    --write-out '%{http_code} %{time_total}' \
                    --output /dev/null "${APP_URL%/}/up")"; then
                    read -r status response_time <<< "$metrics"
                    echo "status=$status time=${response_time}s"
                    if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
                      echo "::error::Health endpoint did not return a 2xx response."
                      exit 1
                    fi
                  else
                    read -r status response_time <<< "$metrics"
                    echo "status=$status time=${response_time}s"
                    echo "::error::Health request failed after retrying."
                    exit 1
                  fi
