name: Docker deployment check

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: portfolio
                    POSTGRES_USER: portfolio
                    POSTGRES_PASSWORD: testing-only
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U portfolio"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v5
            - name: Build production image
              run: docker build --tag portfolio:ci .
            - name: Start and probe production image with PostgreSQL
              shell: bash
              run: |
                  set -euo pipefail
                  trap 'docker logs portfolio-ci; docker rm -f portfolio-ci' EXIT
                  docker run --detach --name portfolio-ci --network host \
                    --env APP_KEY="base64:$(openssl rand -base64 32)" \
                    --env DB_CONNECTION=pgsql \
                    --env DB_URL=postgresql://portfolio:testing-only@127.0.0.1:5432/portfolio \
                    --env SESSION_DRIVER=database --env CACHE_STORE=database \
                    --env QUEUE_CONNECTION=sync --env MAIL_MAILER=log \
                    --env SEED_ON_DEPLOY=true --env DEPLOYMENT_CONTENT_SEED=true \
                    --env ADMIN_EMAIL=admin@example.test \
                    --env ADMIN_PASSWORD=ci-only-long-password portfolio:ci
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://localhost:8080/up; then
                      docker exec portfolio-ci php -r '
                        require "vendor/autoload.php";
                        $app = require "bootstrap/app.php";
                        $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                        $snapshot = json_decode(file_get_contents(config("deployment-content.path")), true, 512, JSON_THROW_ON_ERROR);
                        foreach (["site_settings", "certificates", "portfolio_sections", "media"] as $table) {
                          if (Illuminate\Support\Facades\DB::table($table)->count() !== count($snapshot["tables"][$table])) exit(1);
                        }
                        foreach ($snapshot["assets"] as $path => $filename) {
                          if (! Illuminate\Support\Facades\Storage::disk("public")->exists($path)) exit(1);
                        }
                      '
                      curl --fail --silent http://localhost:8080/ > /dev/null
                      exit 0
                    fi
                    sleep 2
                  done
                  exit 1
            - name: Start and probe production image with SQLite public content
              shell: bash
              run: |
                  set -euo pipefail
                  trap 'docker logs portfolio-sqlite-ci; docker rm -f portfolio-sqlite-ci' EXIT
                  docker run --detach --name portfolio-sqlite-ci --network host \
                    --env APP_KEY="base64:$(openssl rand -base64 32)" \
                    --env DB_CONNECTION=sqlite --env DB_URL= \
                    --env DB_DATABASE=/app/storage/app/database/portfolio.sqlite \
                    --env SESSION_DRIVER=database --env CACHE_STORE=database \
                    --env QUEUE_CONNECTION=sync --env MAIL_MAILER=log \
                    --env SEED_ON_DEPLOY=true --env DEPLOYMENT_CONTENT_SEED=true \
                    --env ADMIN_EMAIL=admin@example.test \
                    --env ADMIN_PASSWORD=ci-only-long-password portfolio:ci
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://localhost:8080/up; then
                      docker exec portfolio-sqlite-ci php -r '
                        require "vendor/autoload.php";
                        $app = require "bootstrap/app.php";
                        $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                        $snapshot = json_decode(file_get_contents(config("deployment-content.path")), true, 512, JSON_THROW_ON_ERROR);
                        foreach (["site_settings", "certificates", "portfolio_sections", "media"] as $table) {
                          if (Illuminate\Support\Facades\DB::table($table)->count() !== count($snapshot["tables"][$table])) exit(1);
                        }
                        if (Illuminate\Support\Facades\DB::table("analytics_visits")->count() !== 0) exit(1);
                        foreach ($snapshot["assets"] as $path => $filename) {
                          if (! Illuminate\Support\Facades\Storage::disk("public")->exists($path)) exit(1);
                        }
                      '
                      curl --fail --silent http://localhost:8080/ > /dev/null
                      exit 0
                    fi
                    sleep 2
                  done
                  exit 1
